name: test
on:
  push:
  pull_request:
  # The fuller fuzz tier (below) is too slow to run on every push and too
  # valuable to run never.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  lua:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nvim: ['v0.10.4', 'v0.11.3', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}
      # Includes tests/test_fuzz.lua, whose fast tier drives ~590 malformed
      # documents through open/goto/step/BufEnter/:cc/reload/close in process
      # (~8s). It is in the per-push suite deliberately: the defect class it
      # covers came back FIVE times, and twice a fuzz that was not run per push
      # said the tree was clean when it was not.
      - name: headless suite
        run: ./tests/run.sh

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      # Pin shellcheck, and print the version it is actually using.
      #
      # This step exists because of a real failure, not tidiness. The runner
      # image ships an UNPINNED shellcheck, and the one it shipped reported
      # trap-invoked cleanup functions as SC2317 ("command appears to be
      # unreachable") where 0.11.0 reports the same false positive as SC2329.
      # Three separate sessions each verified `shellcheck rc=0` completely
      # honestly -- against a different tool than the one gating the build --
      # and main was red for four pushes.
      #
      # An unpinned linter is not a gate, it is a moving target that happens to
      # agree with you most days. Contributors should run this same version;
      # docs/parallel-work.md names it.
      - name: pin shellcheck
        run: |
          set -euo pipefail
          v=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$v/shellcheck-$v.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install -m 0755 "shellcheck-$v/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-$v"
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck bin/walkthrough backends/*.sh install.sh tests/*.sh scripts/with-lock
      - name: backend detection
        run: ./tests/test_backend_detect.sh
      - name: cli
        run: ./tests/test_cli.sh
      # The skill bundle and the installer. install.sh is the first command
      # every user runs; this suite exercises it against a scratch HOME of its
      # own making, never the runner's.
      - name: skill bundle and installer
        run: ./tests/test_skill_bundle.sh
      # scripts/with-lock, the mutex that keeps parallel sessions out of each
      # other's cmux focus assertions (docs/parallel-work.md). Real concurrency:
      # 12 processes contending over one lock, plus the same run with the atomic
      # acquire neutered, which MUST come out interleaved — a contention test
      # that passes without the lock is measuring nothing. No cmux surface is
      # opened and no real $HOME is touched; it is sleeps and files throughout.
      - name: with-lock, under contention
        run: ./tests/test_with_lock.sh
      # cmux is not available on a runner, so this takes its SKIP path. It runs
      # anyway: the guard that makes it skip is the thing that keeps the suite
      # from opening a terminal surface on a machine that has no terminal, and a
      # guard nothing ever executes is a guard nobody notices breaking.
      - name: cmux backend (skips outside cmux)
        run: ./tests/test_backend_cmux.sh
      # The launch command is typed into whatever shell the user happens to
      # run, so this hands the real emitted string to every shell installed
      # and compares the argv that arrives (an nvim stub on PATH, no editor
      # launched). The extra shells are what give it teeth: /bin/sh on this
      # runner is dash, which is precisely the shell that used to open a
      # DIFFERENT FILE in silence (#14).
      - name: install extra shells for the quoting matrix
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ksh tcsh fish
      - name: launch-command quoting, across shells
        run: ./tests/test_backend_quoting.sh
      # The socket wait: how many processes it spawns while nothing is
      # listening (must be none) and whether its diagnostic distinguishes
      # "nvim never started" from "nvim never answered" (#17).
      - name: socket readiness and diagnostics
        run: ./tests/test_backend_socket.sh
      # tmux, unlike cmux, does NOT need to be skipped here. `tmux -L <name>`
      # starts a private server that shares nothing with any other tmux, so
      # the suite re-runs itself inside one and gets full coverage on a
      # headless runner -- focus transitions, teardown and all.
      - name: tmux backend (self-hosts a private tmux server)
        run: ./tests/test_backend_tmux.sh
      # ...and the plain SKIP path, for a machine with no tmux at all.
      - name: tmux backend skips cleanly when told not to self-host
        run: WALKTHROUGH_TMUX_SELFHOST=0 ./tests/test_backend_tmux.sh

  # The fuller fuzz: all three positions of the field x value matrix (~1700
  # documents), and every tenth document ALSO validated out of process by a real
  # `nvim -l validate.lua`, which is what proves the fast tier's in-process
  # verdict is the real gate's verdict rather than a convenient copy of it.
  # ~50s. Nightly and on demand, not per push.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with: { neovim: true, version: stable }
      - name: full fuzz, with the real out-of-process gate sampled
        env:
          WALKTHROUGH_FUZZ: full
          WALKTHROUGH_FUZZ_OOP: '10'
        run: nvim --headless --clean -l tests/test_fuzz.lua
